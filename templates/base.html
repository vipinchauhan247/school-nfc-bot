<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ school_name }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <span class="brand-icon">🏫</span>
                <span class="brand-text">{{ school_name }}</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">Dashboard</a>
                {% if session.admin %}
                <a href="/admin" class="nav-link">Admin</a>
                <a href="/admin/logout" class="nav-link nav-link-muted">Logout</a>
                {% else %}
                <a href="/admin/login" class="nav-link nav-link-admin">Admin Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 {{ school_name }} — Attendance Management System</p>
    </footer>

    <script src="{{ url_for('static', filename='js/sync.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
